name: Release
# 打 v* tag → ① 多架构镜像推 ghcr.io/pigeonbox/p2p(amd64+arm64);
# ② p2pc 直传客户端六平台二进制挂本仓 Release 并回挂 hub(桌面端 sidecar/终端用户分发)。
# 注意:新镜像包默认 private,首个 release 后需在 GitHub Packages 页手动 flip public
# (fnos 踩过的坑)。provenance=false:buildx 默认认证清单会使 GitHub Packages 页
# 渲染 500(拉取不受影响,仅 Web UI 坏)。
on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/pigeonbox/p2p

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.date }}
            GOPROXY=https://proxy.golang.org,direct

  # p2pc / p2pc-web 设备直传客户端六平台二进制: 挂本仓 Release(终端用户/桌面端
  # sidecar 的分发渠道——p2pc 在用户设备上跑,镜像里的二进制够不着他们)。
  # 命名 = Tauri target triple(desktop 仓 CI 按 triple 拉取做 sidecar);
  # p2pc-web = 网页模式客户端(老底座桌面: 内置本地 Web UI + 直传,纯静态无
  # webkit 依赖),资产名同以 p2pc- 开头,复用下方上传/回挂/checksums 通配。
  p2pc-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 交叉编译 p2pc / p2pc-web(纯静态 CGO=0)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-w -s -X 'github.com/pigeonbox/kit/version.Version=${VERSION}' -X 'github.com/pigeonbox/kit/version.BuildCommit=${COMMIT}' -X 'github.com/pigeonbox/kit/version.BuildTime=${BUILD_TIME}'"
          mkdir -p out
          build() { GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath -ldflags="$LDFLAGS" -o "out/$3" ./cmd/$4; }
          build linux   amd64 p2pc-x86_64-unknown-linux-gnu        p2pc
          build linux   arm64 p2pc-aarch64-unknown-linux-gnu       p2pc
          build darwin  amd64 p2pc-x86_64-apple-darwin             p2pc
          build darwin  arm64 p2pc-aarch64-apple-darwin            p2pc
          build windows amd64 p2pc-x86_64-pc-windows-msvc.exe      p2pc
          build windows arm64 p2pc-aarch64-pc-windows-msvc.exe     p2pc
          build linux   amd64 p2pc-web-x86_64-unknown-linux-gnu    p2pcweb
          build linux   arm64 p2pc-web-aarch64-unknown-linux-gnu   p2pcweb
          build darwin  amd64 p2pc-web-x86_64-apple-darwin         p2pcweb
          build darwin  arm64 p2pc-web-aarch64-apple-darwin        p2pcweb
          build windows amd64 p2pc-web-x86_64-pc-windows-msvc.exe  p2pcweb
          build windows arm64 p2pc-web-aarch64-pc-windows-msvc.exe p2pcweb
          (cd out && shasum -a 256 p2pc-* > p2pc-checksums.txt)
      - name: 挂本仓 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" out/p2pc-* --repo "$GITHUB_REPOSITORY" --clobber || {
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "p2p $GITHUB_REF_NAME" \
              --notes "联邦注册中心(p2pd)+设备直传客户端(p2pc / p2pc-web 网页模式)。镜像见 ghcr.io/pigeonbox/p2p" \
              && gh release upload "$GITHUB_REF_NAME" out/p2pc-* --repo "$GITHUB_REPOSITORY";
          }

  # p2pc 二进制回挂生态主仓(产物统一出口)。跨仓写需 P2P_PAT——与 desktop/fnos 同一约定。
  # 断链必须响(2026-10-08 拔除 continue-on-error:P2P_PAT 失效时 v0.4.4 曾疑似被静默吞掉回挂)。
  attach-to-hub:
    runs-on: ubuntu-latest
    needs: p2pc-binaries
    steps:
      - name: 回挂 p2pc 二进制到 hub
        env:
          GH_TOKEN: ${{ secrets.P2P_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          sleep 10
          NOTES=$(printf '%s\n\n---\n🗂 **组件仓库**: [pigeonbox/p2p](https://github.com/pigeonbox/p2p) · **完整变更日志**: [%s](https://github.com/pigeonbox/p2p/releases/tag/%s)\n🌐 **生态总览 / Latest**: [pigeonbox/pigeonbox](https://github.com/pigeonbox/pigeonbox/releases/latest)\n' \
            "P2P 联邦:注册中心镜像(ghcr.io/pigeonbox/p2p)与设备直传客户端 p2pc / p2pc-web 网页模式(见 Assets,文件名含目标平台 triple)。" "${TAG}" "${TAG}")
          gh release view "p2p-$TAG" --repo pigeonbox/pigeonbox >/dev/null 2>&1 || \
            gh release create "p2p-$TAG" --repo pigeonbox/pigeonbox \
              --title "PigeonBox P2P $TAG" \
              --latest=false \
              --notes "${NOTES}"
          mkdir -p /tmp/p2pc
          ok=0
          for i in 1 2 3 4 5 6; do
            if gh release download "$TAG" --repo pigeonbox/p2p --dir /tmp/p2pc --clobber; then ok=1; break; fi
            sleep 15
          done
          [ "$ok" = 1 ] || { echo "::error::拉取本仓 Release 二进制失败"; exit 1; }
          shopt -s nullglob
          for f in /tmp/p2pc/p2pc-*; do
            gh release upload "p2p-$TAG" "$f" --repo pigeonbox/pigeonbox --clobber
          done
          # 组件回挂恒不为 Latest(Latest 属于 hub 生态快照 v*);release 已存在时也兜底纠偏
          gh release edit "p2p-$TAG" --repo pigeonbox/pigeonbox --latest=false || true
          echo "已回挂到 pigeonbox/pigeonbox Releases"
