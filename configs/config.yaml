# FilesCodeBox P2P 注册中心配置样例。
# 所有键均有内置默认,本文件可整体省略。
# 环境变量覆盖(优先级最高): 键中 . 换 _ 加前缀,如 server.port → FCB_P2P_SERVER_PORT。
# 敏感项一律环境变量注入: FCB_P2P_ADMIN_PASSWORD、FCB_P2P_REGISTRATION_TOKEN。

server:
  port: 12346
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 120s
  # 反代(nginx/openresty)部署时置 true,从 X-Forwarded-For 取真实客户端 IP 参与限流;
  # 默认 false 直取 RemoteAddr,防止伪造头绕过限流。
  behind_proxy: false

registration:
  # open: 开放注册(个人部署即可加入联邦) | token: 邀请制(须携带共享注册密钥)。
  mode: open
  token: ""
  # 节点租约区间,节点须周期心跳续租。
  min_node_ttl: 5m
  max_node_ttl: 24h

announce:
  # 单节点公告配额与公告最大 TTL。
  max_per_node: 1000
  max_ttl: 168h

admin:
  # 管理端口令。留空 = 管理 API 整体禁用。生产必须经环境变量注入。
  password: ""

log:
  # debug | info | warn | error
  level: info
